services:
  - type: web
    name: helvetia-machine
    runtime: docker
    rootDir: backend/HelvetiaApi
    dockerfilePath: Dockerfile
    disk:
      name: helvetia-uploads
      mountPath: /app/wwwroot/uploads
      sizeGB: 1
    # Secrets are set in the Render dashboard, never committed.
    envVars:
      - key: Jwt__Key
        sync: false
      - key: Admin__Username
        sync: false
      - key: Admin__Password
        sync: false
